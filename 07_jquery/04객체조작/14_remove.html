<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>remove()</title>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script>
        $(function(){
            let copyObj = $('.box1').children().clone();
            console.log(copyObj);
            $('.box2').remove();
            $('.box3').empty();
            $('box3').append(copyObj); //복사 붙여넣기(?)
        });
    </script>
</head>
<body>
    <div class="box1">
        <p>내용1</p>
        <p>내용2</p>
    </div>
    <div class="box2">
        <p>내용3</p>
        <p>내용4</p>
    </div>
    <div class="box3">
        <p>내용5</p>
        <p>내용6</p>
    </div>
</body>
</html>
<!-- 
* clone : 복사
* remove : 삭제
* empty : 내용이 빈 것처럼 사라짐
-->
