<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>속성 상태에 따른 탐색 선택자</title>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script>
        $(function(){
            $('#wrap p:hidden').css({
                display : 'block',
                background : '#ff0',
            });
            let z1 = $('#zone1 :selected').val();
            console.log(z1);
            let z2 = $('#zone2 :checked').val();
            console.log(z2);

            $('.btn1').click(function(){
                let z3 = $('#zone3 :checked').val();
                console.log(z3);
            });
        });
    </script>
</head>
<body>
    <div id="wrap">
        <p>내용1</p>
        <p style="display: none;">내용2</p>
        <p>내용3</p>
    </div>
    <form accept="#">
        <p id="zone1">
            <select name="course" id="course">
                <option value="opt1">옵션1</option>
                <option value="opt2" selected>옵션2</option>
                <option value="opt3">옵션3</option>
            </select>
        </p>
        <p id="zone2">
            <input type="checkbox" name="hobby1" value="독서">독서
            <input type="checkbox" name="hobby2" value="자전거">자전거
            <input type="checkbox" name="hobby3" value="등산" checked>등산
        </p>
        <p id="zone3">
            <input type="radio" name="gender" value="male">남성
            <input type="radio" name="gender" value="female" checked>여성
            <button type="button" class="btn1">남성여성 전송</button>
        </p>

    </form>
</body>
</html>
