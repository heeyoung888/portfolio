<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소명 선택자</title> <!-- 엘리먼트 : 태그 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><!-- 제이쿼리cdn -->
    <script>//바디 들어가기 전, 레디펀션
        $(function (){
            $('h2').css({
                background : '#0ff',
                border : '1px solid #ccc',
                color : 'blue',
            })
        });//ready end
    </script>
</head>
<body>
    <h1>제이쿼리</h1>
    <h2>선택자</h2>
    <h3>직접 선택자</h3>
</body>
</html>
