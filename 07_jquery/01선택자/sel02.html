<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클래스 선택자</title>
    <script src="js/jquery-3.7.1.min.js"></script><!-- 제이쿼리는 내 스크립트보다 위에 있어야 사용 가능 -->
</head>
<body>
    <h1>제이쿼리</h1>
    <h2 class="tit">선택자</h2>
    <h3>직접 선택자</h3>
    <script>//헤드 또는 바디에서 사용 가능, h밑에 작성 시 펑션 사용 안해도됨
        $('.tit').css({
            backgroundColor : '#f00',
            border:'2px solid #ff0',
        })
    </script>
</body>
</html>
