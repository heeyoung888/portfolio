<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let age = prompt('나이를 입력하세요','20')/* 입력 , string*/
        document.write(typeof age + '<br>');
        age = Number(age);/* 문자였던 것을 숫자로 바꾸겠다 */
        document.write('당신의 나이는 '+ age +'세 입니다. <br>');/* 출력 */
        document.write('당신의 "나이는 ' + (age+1) + '세" 입니다. <br>');
        document.write("당신의 \"나이는 " + age + "세\" 입니다.<br>")
    </script>
</body>
</html>

<!-- 여기서 사용하는 = 은 "같다는 표시가 아님. 오른쪽의 값을 왼쪽의 속성으로 옮겨주는 것." -->
