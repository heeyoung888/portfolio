<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>const와 var, let의 차이점</title>
</head>
<body>
    <script>
        let cm = prompt('m로 변환할 cm를 입력하세요');
        const dValue = 100; /* 선언과 동시에 값 할당하기 . 선언만 하지 않기 */
        let m = cm/dValue;
        document.write(m + 'm 입니다');
    </script>
</body>
</html>
<!-- let 변수선언 -->
