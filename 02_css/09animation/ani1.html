<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title><!-- 호버하지 않아도 자동으로 움직임 -->
    <style>
        .box {
            width: 100px;
            height: 100px;
            background: blue;
            animation-name: changeBg;
            animation-duration: 3s;
            animation-iteration-count: infinite;/* 무한반복 */
            animation-direction: alternate;
        }

        @keyframes changeBg {
            from {
                background: blue;
                border: 1px solid #000;
            }

            to {
                background: red;
                border: 1px solid blue;
                border-radius: 50%;
            }
        }
    </style>
</head>

<body>
    <div class="box"></div>
</body>

</html>
