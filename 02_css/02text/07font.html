<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font 속성</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap');

        p{
            font:italic 700 20px/1.6 "Baloo 2", serif;
        }
        /* serif, san-serif : 명조 혹은 고딕 */
    </style>
</head>
<body>
    <h2>font 속성</h2>
    <p>글꼴 관련 속성들을 한꺼번에 표시</p>
    <p>기본형 font : font-style font variant font weight font-size/Line height font-family</p>
    <!-- 필수 : font-size/Line height font-family ? -->
</body>
</html>
