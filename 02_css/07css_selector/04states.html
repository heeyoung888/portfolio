<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상 클래스</title>
    <style>
        form fieldset{
            margin-bottom: 25px;
        }
        form legend{font-size: 15px; font-weight: bold;}
        form input:disabled{
            background: #000;
            border: 1px solid red;
        }
        form input:checked + span{color: blue;}/* 체크했을 때 글씨색깔 */
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>사용자 정보</legend>
            <label>이름 : <input type="text" disabled></label>
        </fieldset>
        <fieldset>
            <legend>신청 과목</legend>
            <p>이 달에 신청할 과목을 선택하세요</p>
            <label>
                <input type="radio" name="subject" value="speaking">
                <span>회화</span>
            </label>
            <label><input type="radio" name="subject" value="grammar">
                <span>문법</span>
            </label>
            <label><input type="radio" name="subject" value="writing">
                <span>작문</span>
            </label>
        </fieldset>
    </form>
</body>
</html>
