<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내부 스타일 시트</title>
    <style>
        /* 내부 스타일 시트, 아이디 불러올 때 # */ 
        #container { 
            background-color: blueviolet;
        }
        section {
            width: 300px;
            background-color: yellow;
            border: 5px solid #ccc;
            padding: 20px;
            margin: 10px;
        }
    </style>
    <link rel="stylesheet" href="css/03.style.css"><!-- 외부 스타일 시트는 연결필요 -->
    <!-- 충볼(중복) 시 밑에 있을 수록 브라우저에 나타남, 위에서 아래로 흐른다 --> 
</head>
<body>
    <div id="container"> <!-- div : 블록 -->
        <section><!-- 주제가 있는 컨텐츠 태그 : 제목이 꼭 들어가야함 -->
            <h2>who am i?</h2>
            <p>프론트엔드 웹기술에 관심이 많습니다<br>
                현재 제주의 한 시골 마을에서 코딩 중입니다
            </p>
        </section>
    </div>
</body>
</html>
