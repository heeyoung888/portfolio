<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline-block</title>
    <style>
        *{margin: 0; padding: 0;}
        nav{width: 100%; height: 60px; background: #069;}
        nav ul{list-style-type: none;}
        nav ul li{
            width: 100px; background: khaki; display: inline-block; 
            text-align: center; line-height: 60px;
            margin: 20px; color: #fff;
        }
        nav ul li a{text-decoration: none; color: inherit; display: inline-block; width: 100%;}
        /* 가로 길이 : 부모사이즈의 100%가져오는 것과 동일 */
        /* 적당한 여백의 사이즈를 주면서 위로 올리고 싶을 경우 인라인 블록 사용 : 기본으로 3px정도의 마진이 생김 */
        /* inherit : 부모로부터 속성을 상속받음 */
        /* 사용자 편의를 위해 클릭 영역 넓힘 */
        nav ul li a:hover{
            color: #000;
            background: #fff;
            text-decoration: underline;
        }
        .none{background: lawngreen; display: none;}/* 원래 블록이지만 none을 넣자 사라짐 */
        .a{background: yellow; width: 50%; height: 50px;} /* 사이즈를 넣어야 나타남 */
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">메뉴1</a></li>
            <li><a href="#">메뉴2</a></li>
            <li><a href="#">메뉴3</a></li>
            <li><a href="#">메뉴4</a></li>
            <li><a href="#">메뉴5</a></li>
        </ul>
    </nav>
        <!-- .none .a-->
    <div class="none">none</div>
    <div class="a"></div>

</body>
</html>
