<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition</title>
    <style>
        h1 {
            text-align: center;
            font-size: 52px;
        }
        .tr1{
            width: 100px;
            height: 100px;
            background-color: red;
            border: 1px solid #000;
            transition-property: background-color,transform,width,height;/* 대상지정 *//* <!-- 중간지점:호버되기 전에 지정 --> */
            transition-duration: 2s,3s,4s,5s;/* 위 대상 초 지정 */
            transition-delay: 1s;/* 1초 후에 시작하겠다 */
        }
        .tr1:hover{
            width: 200px;
            height: 200px;
            background-color: #ff6e5f;
            transform: rotate(180deg);
        }
    </style>
</head>

<body>
    <div class="tr1">
        <h1>!</h1>
    </div>
</body>

</html>
