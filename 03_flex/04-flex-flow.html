<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <link rel="stylesheet" href="default.css">
    <style>
        .flex-container{
            display: flex;
            width: 300px;
            flex-flow: row wrap;

            /* 아래 두줄을 줄여 쓴 것 */
            flex-direction: row;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="flex-item">AAAAAAAAA</div>
        <div class="flex-item">BBBBBB</div>
        <div class="flex-item">CCCCCCCCCCC</div>
    </div>
</body>
</html>
