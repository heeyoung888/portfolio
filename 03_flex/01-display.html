<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <link rel="stylesheet" href="default.css">
    <style>
        .flex-container{
            display: flex; /* 부모에게 주는 속성 : 자식이 위로 올라갈 때 */ 
            height: 100px; /* 부모만큼 늘어나는게 기본값 */
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="flex-item">AAA</div>
        <div class="flex-item">BBB</div>
        <div class="flex-item">CCC</div>
    </div>
</body>
</html>
