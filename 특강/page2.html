<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script src="https://unpkg.com/three@0.141.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.141.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.141.0/examples/js/controls/OrbitControls.js"></script>
    <script>

        // 장면(Scene) 생성
        let scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        //빛추가
        const light = new THREE.DirectionalLight(0xffffff,1);
        light.position.set(1,1,1).normalize();
        scene.add(light);

        // 카메라 생성 시야각,화면종횡비,근접제한,원거리
        //시야각 : 카메라가 보는 시야각, 값이 클수록 넓게, 작을수록 좁고 확대된 느낌
        //화면종횡비:카메라 화면의 비율, 일반적 브라우저의 창 크기
        //근접제한 : 카메라로부터 이거리보다 가까우면 안보이게(렌더링 되지 않도록), 근거리에서 잘리게
        //원거리 : 카메라로부터 이 거리보다 멀면 안 보이게(렌더링 되지 않도록) 
        let camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 5000);
        camera.rotation.y = 45 / 180 * Math.PI;
        camera.position.set(10, 1, 10);

        // 렌더러 생성 및 설정
        let renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 컨트롤 추가
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        controls.enablePan = true;
        controls.enableRotate = true;
        controls.enableZoom = true;
        
        //애니메이션 루프 (계속해서 그리기)
        function animate() {
            console.log("[+] animate()");

            requestAnimationFrame(animate);
            renderer.render(scene, camera);
            controls.update();
        }
        //모델 추가하기(geometry, material)
        /* const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshNormalMaterial(); */
        /* const cube = new THREE.Mesh(geometry, material); */

        /* scene.add(cube); */
        animate();

        //GJTF 모델 불러오기(예시 URL)
        const loader = new THREE.GLTFLoader();
        loader.load(
           '../model/model.glb',
           function (gltf) {
            scene.add(gltf.scene);
           },
           undefined,
           function (error) {
            console.error('모델 로딩 오류:', error);
           }
        );



    </script>
</body>

</html>

<!-- 
시야각(fov):카메라가 보는 시야각, 값이 클수록 넓게, 작을 수록 좁고 확대된 느낌
화면종횡비(aspect):카메라 화면의 비율, 일반적 브라우저의 창 크기
근접제한(near) : 카메라로부터 이 거리보다 가까우면 안보이게(랜더링 되지 않도록)
원거리(far):카메라로부터 이 거리보다 멀면 안보이게(랜더링 되지 않도록)
-->
