<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1박2일 가족 여행 코스</title>
</head>
<body>
    <h2>1박2일 가족 여행 코스</h2>
    <ul>
        <li>
            1일차
            <ol type="A" reversed><!-- ul안에 li만 들어가기 때문에 li안에 ol을 넣음 -->
                <li>해녀박물관</li>
                <li>낚시체험</li>
            </ol>
        </li>
        <li>
            2일차
            <ol start="3">
                <li>용눈이오름</li>
                <li>만장굴</li>
                <li>카약체험</li>
            </ol>
        </li>
    </ul>
</body>
</html>
