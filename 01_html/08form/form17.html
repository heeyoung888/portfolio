<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹폼</title>
    <style>
        form fieldset ul li label em{
            color: red;
        }
        form fieldset ul li label{
            width: 130px;
            font-size: 14px;
            float: left;
        }
        ul{
            list-style: none;
        }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>로그인</legend>
            <label for="login-id">아이디</label>
            <input type="text" id="login-id" size="10" autofocus>
            <label for="login-pw">비밀번호</label>
            <input type="password" id="login-pw" size="10">
            <input type="submit" value="로그인"><!-- submit/button -->
        </fieldset>

        <fieldset>
            <legend>가입하기</legend>
            <ul>
                <li>
                    <label for="join-id">아이디<em>*</em></label>
                    <input type="text" id="join-id" size="20" required>
                </li>
                <li>
                    <label for="join-pw">비밀번호<em>*</em></label>
                    <input type="password" id="join-pw" size="20" required>
                </li>
                <li>
                    <label for="join-pw2">비밀번호확인<em>*</em></label>
                    <input type="password" id="join-pw2" size="20" required>
                </li>
                <li>
                    <label for="uname">이름<em>*</em></label>
                    <input type="text" id="uname" size="20" required>
                </li>
                <li>
                    <label for="new_email">메일주소<em>*</em></label>
                    <input type="email" id="new_email" size="20" required>
                </li>
                <li>
                    <label for="new_tel">전화번호</label>
                    <input type="tel" id="new_tel" size="20">
                </li>
            </ul>
        </fieldset>

            <fieldset>
                <legend>이지스퍼블리싱</legend>
                <textarea cols="60" rows="5">
                    Lorem, ipsum dolor sit amet consectetur adipisicing elit. Soluta commodi adipisci tempora iste dolorem. Architecto incidunt quam ad aperiam natus temporibus quisquam dolorem, harum debitis eaque aliquam? Obcaecati, maiores consectetur?
                </textarea>
            </fieldset>
            <fieldset>
                <input type="submit" value="가입하기">
                <input type="reset" value="다시쓰기">
            </fieldset>
    </form>
</body>
</html>

<!-- - 로그인 id/for 아이디 비번 : 사이즈 10 로그인 버튼 : 인풋태그, submit 사용
- 가입하기 : ul li 사이즈 20 id/for id:유일한 것ex) joinid
별표 : em label 안에 넣기 / 필수입력 : input에 필수입력속성넣기
- textarea : cols60 rows5
- 레전드 없음 : 인풋으로 작업하고 버튼은 사용하지 않기 -->
