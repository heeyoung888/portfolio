<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe</title>
</head>
<body>
    <div class="container">
        <h2>iframe 태그를 이용해 외부문서(사이트) 포함 시키기</h2>
        <iframe src="https://www.gmarket.co.kr" width="1000" height="500"></iframe>
        <iframe src="http://naver.com"></iframe><!-- iframe 거부하는 사이트 있음 -->
        <iframe src="object.html"></iframe><!-- 내부문서 -->
        <iframe width="560" height="315" src="https://www.youtube.com/embed/ekr2nIex040?si=onuNSCaxu521qGJl" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
</body>
</html>
